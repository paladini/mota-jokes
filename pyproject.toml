[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mota-jokes"
version = "0.1.3"
description = "Uma biblioteca Python para manter vivas as piadas ruins do Mota."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Amigos do Mota" }
]
keywords = ["jokes", "meme", "python", "php", "mota"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/paladini/mota-jokes"
Repository = "https://github.com/paladini/mota-jokes"
Issues = "https://github.com/paladini/mota-jokes/issues"

[project.scripts]
mota = "mota.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
